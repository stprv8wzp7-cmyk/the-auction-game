function showScores(){closeActiveDialog(false);let d=document.createElement('div');d.id='scores-overlay';d.className='vault-overlay';d.innerHTML=`<section class="vault-dialog score-guide" role="dialog" aria-modal="true" aria-label="役の点数一覧"><div class="spaced"><h2>💎 役の点数</h2><button class="btn gray" data-close-scores>閉じる ✕</button></div><div class="score-guide-list"><div><strong>4点</strong><span>同じスート4枚</span><small>例：♠2・♠5・♠8・♠K</small></div><div><strong>8点</strong><span>4連番・すべて違うスート</span><small>例：♠5・♥6・♦7・♣8</small></div><div><strong>12点</strong><span>同じスートの4連番</span><small>例：♥7・♥8・♥9・♥10</small></div><div><strong>20点</strong><span>同じ数字4枚</span><small>例：♠Q・♥Q・♦Q・♣Q</small></div></div><p class="muted tiny">J-Q-K-Aは連番。A-2-3-4は連番になりません。</p><p class="muted tiny">役成立時はフォールドで得点確定、コンティニューで保留します。</p></section>`;document.body.appendChild(d);wireDialog(d,'[data-close-scores]')}
function showVault(){if(!g)return;closeActiveDialog(false);let d=document.createElement('div');d.id='vault-overlay';d.className='vault-overlay';d.innerHTML=`<section class="vault-dialog" role="dialog" aria-modal="true" aria-label="保留カード"><div class="spaced"><h2>💎 保留中の役カード</h2><button class="btn gray" data-close-vault>閉じる ✕</button></div><p class="muted tiny">コンティニューで確保した役のカードを表示します。得点確定まで保留中です。</p>${g.players.map(x=>`<div class="vault-player"><b>${x.name} · 保留${x.pending}点</b>${x.pendingCards.length?`<div class="vault-groups">${Array.from({length:Math.ceil(x.pendingCards.length/4)},(_,j)=>`<div class="vault-group"><div class="vault-meld-name">${(()=>{let m=meld(x.pendingCards.slice(j*4,j*4+4));return m?`${m.name} · +${m.points}点`:`保留役 ${j+1}`})()}</div>${cards(x.pendingCards.slice(j*4,j*4+4))}</div>`).join('')}</div>`:'<p class="muted">保留カードなし</p>'}</div>`).join('')}</section>`;document.body.appendChild(d);wireDialog(d,'[data-close-vault]')}
function clearExchangeFlights(){
 if(typeof document.querySelectorAll!=='function')return;
 document.querySelectorAll('.exchange-fly').forEach(el=>{if(el.getAnimations)el.getAnimations().forEach(a=>a.cancel());el.remove()});
}
function requestExchangeAnimation(){
 if(!g||g.phase!=='exchange'||!g.ctx.exchange||g.ctx.exchange.animationScheduled)return;
 if(typeof window==='undefined'||typeof window.requestAnimationFrame!=='function')return;
 const exchange=g.ctx.exchange;exchange.animationScheduled=true;
 window.requestAnimationFrame(()=>{if(!g||g.phase!=='exchange'||g.ctx.exchange!==exchange||exchange.reviewed)return;
  let ex=exchange;
  let rows=Array.from(document.querySelectorAll('.exchange-handrow'));
  const position=(owner,id)=>{let row=rows[owner];if(!row)return null;let idx=ex.before[owner].findIndex(c=>c.id===id);let el=row.querySelectorAll('.card')[idx];if(!el)return null;let r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}};
  const destination=(owner)=>{let row=rows[owner];if(!row)return null;let r=row.getBoundingClientRect();return {x:r.left+r.width*.75,y:r.top+r.height/2}};
  const fly=(c,from,to,delay)=>{if(!from||!to||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;let el=document.createElement('div');el.className='exchange-fly '+(red(c.s)?'reds':'');el.textContent=label(c);el.style.left=(from.x-25)+'px';el.style.top=(from.y-33)+'px';document.body.appendChild(el);if(typeof el.animate==='function'){let a=el.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${(to.x-from.x)*.5}px,${(to.y-from.y)*.5-35}px) scale(1.1)`,opacity:1,offset:.5},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px) scale(.85)`,opacity:0}],{duration:950,delay,easing:'ease-in-out',fill:'forwards'});a.onfinish=()=>el.remove()}else{el.remove()}setTimeout(()=>el.remove(),1600)};
  fly(ex.stolen,position(ex.other,ex.stolen.id),destination(ex.who),0);
  fly(ex.given,position(ex.who,ex.given.id),destination(ex.other),260);
 });
}
function playEffect(text,who=null,type='success',cardIds=null){if(!g||g.phase==='error')return;let host=document.querySelector('.wrap');if(!host)return;let old=host.querySelector('.fx-toast');if(old)old.remove();let n=document.createElement('div');n.className='fx-toast '+type;n.textContent=text;host.appendChild(n);if(who!==null){let row=host.querySelectorAll('.handrow')[who];if(row){row.classList.add('fx-hand');setTimeout(()=>row.classList.remove('fx-hand'),750)}}if(cardIds&&cardIds.length){let strip=document.createElement('div');strip.className='fx-cards';strip.innerHTML=cardIds.map((c,i)=>`<span style="--dir:${i%2?1:-1}">${c}</span>`).join('');host.appendChild(strip);setTimeout(()=>strip.remove(),1300)}setTimeout(()=>n.remove(),1350)}
function exchangeCards(hand,owner,ex,after){let changed=owner===ex.who?(after?ex.stolen.id:ex.given.id):(after?ex.given.id:ex.stolen.id);return `<div class="cards">${hand.map(c=>`<span class="exchange-card-slot ${c.id===changed?'exchange-changed':''}">${card(c)}</span>`).join('')}</div>`}
function render(){if(!g){title();return}let p=g.players,phase=g.phase;["choose","pass","exchange","reveal"].forEach(x=>document.body.classList.toggle("phase-"+x,phase===x));let scores=`<div class="score score-tappable" data-open-vault="true" role="button" tabindex="0" aria-label="保留中のカードを見る">${p.map((x,i)=>`<div><div class="muted tiny">${x.name}</div><strong>${x.score}<small class="point-unit"> pt</small></strong><div class="tiny muted">保留 ${x.pending}点 · 💎タップで確認</div></div>`).join('')}</div>`;let hands=`<section class="panel hands-panel"><h3>🃏 公開手札</h3>${p.map(x=>`<div class="handrow"><span class="handname">${x.name}</span>${cards(x.hand)}</div>`).join('')}</section>`;let tail=`<div class="utility">${btn('💎 役の点数','scores','gray')}${btn('🃏 保留カード','vault','gray')}${btn('終了','confirmtitle','gray')}</div>`;let phaseNames={choose:'行動選択',pass:'端末受け渡し',reveal:'同時公開',discard:'探索・返却',stealpick:'盗み',stealgive:'カード交換',exchange:'交換結果',meld:'役成立',decisionPass:'決断待ち',roundover:'ラウンド終了',gameover:'試合終了',error:'エラー'};let body=`<div class="phasebar"><span>💎 ${phaseNames[phase]||phase}</span><span>使用済み <b>${g.spent.length}</b> 枚</span></div>${scores}`;if(phase==='choose'){let who=g.mode==='cpu'?0:(p[0].choice?1:0);let whoP=p[who];body+=`${hands}<section class="panel choice-panel"><h2>⚔️ ${whoP.name}の行動選択</h2><div class="actions">${Object.keys(A).map(k=>btn(A[k],`choose:${who}:${k}`,k==='explore'?'green':'',!allowed(whoP).includes(k))).join('')}</div></section>`}else if(phase==='pass'){body+=`<section class="panel center"><h2>📱 スマホを渡してください</h2><p>プレイヤー1の行動は確定しました。</p><p class="muted">プレイヤー2は、画面を受け取ったら下のボタンを押してください。</p>${btn('プレイヤー2の行動選択へ','pass','green')}</section>`}else if(phase==='reveal'){body+=`<section class="panel center"><h2>⚔️ 同時行動公開！</h2><div class="score reveal-results">${p.map((x,i)=>`<div class="outcome ${outcome(i)}"><div>${x.name}</div><h2>${A[x.choice]}</h2><b class="outcome-label">${outcome(i)==='success'?'✓':'✕'} ${outcomeText(i)}</b><p class="outcome-detail">${outcomeDetail(i)}</p></div>`).join('')}</div>${actionTimeline()}<p class="result-guide">${g.mode==='pvp'?'両プレイヤーの結果を確認してから進んでください':'あなたとCPUの結果を確認してから進んでください'}</p>${btn('結果を確認して進む','next','green')}</section>${hands}`}else if(phase==='discard'){let t=g.ctx.task,who=t.who;body+=`<section class="panel"><h2>🔍 ${p[who].name}の探索</h2><div class="notice">山札へ返すカードを1枚選択してください。</div><div class="operation-cue"><span class="moving-card">🃏</span><span>山札 → ${p[who].name} → 山札</span></div><p class="muted tiny">5枚から1枚返却（盗みを受けた場合は交換後に返却）</p>${cards(p[who].hand,true)}<p class="center">${ui.pick?'返却：'+ui.pick+'（再タップで解除）':'カードをタップして選択'}</p>${btn(ui.pick?'↩️ '+ui.pick+' を山札に戻す':'返すカードを選んでください','discard','green',!ui.pick)}</section>${p.map((x,i)=>i!==who?`<section class="panel"><h3>${x.name}</h3>${cards(x.hand)}</section>`:'').join('')}`}else if(phase==='stealpick'){let t=g.ctx.task;body+=`<section class="panel"><h2>${p[t.other].choice==='steal'&&p[t.who].choice==='defend'?'🛡️ カウンター盗み':'🕵️ '+p[t.who].name+'の盗み'}</h2><p class="muted">${p[t.other].name}から奪うカードを選択</p><div class="operation-cue">${p[t.other].name} <span class="moving-card">🃏</span> → ${p[t.who].name}</div>${cards(p[t.other].hand,true)}<p class="center">${ui.pick?'奪う：'+ui.pick+'（再タップで解除）':'カードをタップして選択'}</p>${btn(ui.pick?'🕵️ '+ui.pick+' を奪う':'奪うカードを選んでください','stealchoose','green',!ui.pick)}</section><section class="panel"><h3>${p[t.who].name}の手札</h3>${cards(p[t.who].hand)}</section>`}else if(phase==='stealgive'){let t=g.ctx.task;body+=`<section class="panel"><h2>🔄 ${p[t.who].name}が渡すカード</h2><p class="notice">${p[t.other].name}から${g.ctx.stolen}を奪います。代わりに渡すカードを選択。</p><div class="operation-cue">${p[t.who].name} <span class="moving-card">🃏</span> → ${p[t.other].name}</div><div class="steal-preview"><span class="muted tiny">奪うカード（選択済み）</span><span class="steal-preview-card">${g.ctx.stolen}</span><span class="muted tiny">↓ 自分の手札に入ります</span></div><h3 class="give-heading">${p[t.who].name}の手札から渡す1枚を選択</h3>${cards(p[t.who].hand,true)}<p class="center">${ui.pick?'渡す：'+ui.pick+'（再タップで解除）':'カードをタップして選択'}</p><div class="rowbuttons">${btn('← 奪うカードを選び直す','stealback','gray')}${btn(ui.pick?'🔄 '+g.ctx.stolen+' ⇄ '+ui.pick+' を交換':'渡すカードを選んでください','stealgive','green',!ui.pick)}</div></section>`}else if(phase==='exchange'){let ex=g.ctx.exchange;let exchanged=!!ex.reviewed;body+=`<section class="panel exchange-stage"><h2>🔄 ${p[ex.who].name}の盗み成功！</h2><div class="notice">${p[ex.other].name}から <b>${label(ex.stolen)}</b> を奪い、<b>${label(ex.given)}</b> を渡しました</div><div class="exchange-flow" aria-label="カード交換の方向"><div class="exchange-piece"><small>${p[ex.other].name} → ${p[ex.who].name}</small>${label(ex.stolen)} を奪う</div><span class="exchange-arrow">⇄</span><div class="exchange-piece"><small>${p[ex.who].name} → ${p[ex.other].name}</small>${label(ex.given)} を渡す</div></div><div class="exchange-step" role="status" aria-live="polite">${exchanged?"STEP 2 / 2　交換後の手札":"STEP 1 / 2　交換前の手札"}</div><div class="exchange-stage-hands">${(exchanged?p.map(x=>x.hand):ex.before).map((hand,i)=>`<div class="handrow exchange-handrow"><span class="handname">${p[i].name}</span>${exchangeCards(hand,i,ex,exchanged)}</div>`).join('')}</div><p class="muted tiny center">${exchanged?"交換完了！ 光るカードが新しく入ったカードです":"光るカードが交換対象です。次に交換後の手札を確認できます"}</p>${exchanged?btn('この交換を確認して次へ','exchangecontinue','green'):btn('交換後の手札を確認 →','exchangereview','green')}</section>`}else if(phase==='meld'||phase==='decisionPass'){body+=`${hands}<section class="panel"><h2>💎 役成立！</h2>${phase==='decisionPass'?'':g.melds.map((m,i)=>m?`<div class="notice" style="margin:8px 0">${p[i].name}：<b>${m.name} +${m.points}点</b></div>`:'').join('')}${phase==='decisionPass'?`<div class="center"><h3>📱 プレイヤー2にスマホを渡す</h3><p class="muted">プレイヤー1の決断は非公開です。画面を渡してから次へ進んでください。</p>${btn('プレイヤー2の選択へ','decisionpass','green')}</div>`:(()=>{let who=g.melds.findIndex((m,i)=>m&&!g.decisions[i]);if(who<0)return '<p>決定を処理中</p>';return `<h3>${p[who].name}の決断</h3><p class="muted tiny">両者同時成立時は、どちらかがフォールドすると両者に得点が入ります。</p><div class="rowbuttons">${btn('🏳️ フォールド',`decide:${who}:fold`,'gold')}${btn('🔥 コンティニュー',`decide:${who}:continue`,'green')}</div>`})()}</section>`}else if(phase==='error'){body+=`<section class="panel"><h2>⚠️ 処理エラー</h2><p>カード枚数またはカードの重複に異常を検出しました。対戦を終了して再開してください。</p></section>`}else if(phase==='roundover'||phase==='gameover'){body+=`<section class="panel center result-panel"><div class="gem">${phase==='gameover'?'🏆':'💎'}</div><h2>${phase==='gameover'?'最終結果':'ラウンド終了'}</h2><p class="result-scores">${p[0].score} <span>—</span> ${p[1].score}</p>${phase==='gameover'?`<h2>${p[0].score===p[1].score?'引き分け！':`${p[0].score>p[1].score?p[0].name:p[1].name} の勝利！`}</h2>`:''}${btn(phase==='gameover'?'もう一度遊ぶ':'次のラウンドへ',phase==='gameover'?'again':'round','green')}</section>${hands}`}layout(body+tail);if(phase==='exchange'&&!g.ctx.exchange.reviewed)requestExchangeAnimation();app.querySelectorAll('[data-open-vault]').forEach(e=>{e.addEventListener('click',showVault);e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();showVault()}})});if(phase==='reveal'){let rs=app.querySelectorAll('.outcome');rs.forEach((e,i)=>{e.style.animationDelay=(i*180)+'ms';e.setAttribute('aria-label',p[i].name+'：'+outcomeText(i))})}}function dispatch(act){if(act==='title'&&!g){title();return}if(act==='help'&&!g){help();return}if((act==='newcpu'||act==='newpvp')&&!g){make(act==='newcpu'?'cpu':'pvp');return}if(act==='vault'&&g){showVault();return}if(act==='scores'&&g){showScores();return}if(act==='exchangereview'&&g&&g.phase==='exchange'){clearExchangeFlights();g.ctx.exchange.reviewed=true;render();return}if(act==='exchangecontinue'&&g&&g.phase==='exchange'&&g.ctx.exchange.reviewed){clearExchangeFlights();g.ctx={};processNext();return}if(act==='confirmtitle'&&g){closeActiveDialog(false);clearExchangeFlights();title();return}if(act==='again'&&g&&g.phase==='gameover'){make(g.mode);return}if(act==='round'&&g&&g.phase==='roundover'){startRound();return}if(act==='pass'&&g&&g.phase==='pass'){g.phase='choose';render();return}if(act==='next'&&g&&g.phase==='reveal'){processNext();return}if(!g)return;if(act==='discard'){if(g.phase==='discard'&&g.ctx.task&&ui.pick)doDiscard(g.ctx.task.who,ui.pick);ui.pick=null;return}if(act==='stealchoose'){if(g.phase!=='stealpick'||!g.ctx.task||!ui.pick||!g.players[g.ctx.task.other].hand.some(c=>c.id===ui.pick))return;g.ctx.stolen=ui.pick;ui.pick=null;g.phase='stealgive';render();return}if(act==='stealback'&&g.phase==='stealgive'&&g.ctx.task?.kind==='steal'){g.ctx.stolen=null;ui.pick=null;g.phase='stealpick';render();return}if(act==='stealgive'){if(g.phase==='stealgive'&&g.ctx.task&&ui.pick&&g.players[g.ctx.task.who].hand.some(c=>c.id===ui.pick))doSteal(g.ctx.task.who,g.ctx.stolen,ui.pick);ui.pick=null;return}if(act==='decisionpass'&&g&&g.phase==='decisionPass'){g.phase='meld';render();return}if(act.startsWith('choose:')){let [,i,a]=act.split(':');choose(+i,a);return}if(act.startsWith('decide:')){let [,i,d]=act.split(':');decide(+i,d);return}}if(typeof globalThis.__gemstoTestHook==='function')globalThis.__gemstoTestHook({make,cpuAction,cpuFold,allowed,choose,reveal,processNext,cardIntegrity,evalHand,dispatch,getGame:()=>g,setGame:x=>{g=x},setPick:x=>{ui.pick=x}});title();})();
</script></body></html>
