<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ウルトラマン VS ベムラー｜2Dアクション試作2</title><style>*{box-sizing:border-box}body{margin:0;background:#090f1d;color:#f5f7ff;font-family:system-ui,-apple-system,sans-serif;text-align:center}main{max-width:940px;margin:auto;padding:8px}h1{font-size:clamp(19px,5vw,29px);margin:8px 0 4px;letter-spacing:.05em}.sub{font-size:11px;color:#a7bbd1;margin-bottom:8px}.stage{position:relative;border:2px solid #51677d;border-radius:12px;overflow:hidden;box-shadow:0 12px 36px #0007}canvas{display:block;width:100%;aspect-ratio:900/480;touch-action:none;background:#101e30}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px auto;max-width:900px}button{border:1px solid #8198b4;border-bottom:3px solid #627a9c;border-radius:13px;background:linear-gradient(#344762,#1c2b44);color:white;font-weight:750;font-size:clamp(12px,3.5vw,17px);padding:16px 2px;min-height:66px;touch-action:none;user-select:none;-webkit-user-select:none}button:active,button.pressed{background:#446b87;transform:translateY(2px)}button.special{background:linear-gradient(#23697c,#123b60);border-color:#5ad5f0}button#restart{background:linear-gradient(#68443c,#422b34)}.help{color:#a6b6ce;font-size:12px;line-height:1.6;margin:8px 0}.hint{color:#e6c985;font-size:12px;margin:8px 0 0}</style></head><body><main><h1>ウルトラマン VS ベムラー</h1><div class="sub">第1話「ウルトラ作戦第一号」｜アニメーション検証版 02</div><div class="stage"><canvas id="game" width="900" height="480"></canvas></div><div class="controls"><button data-k="left">◀ 移動</button><button data-k="right">移動 ▶</button><button data-k="jump">ジャンプ</button><button data-k="guard">ガード</button><button data-k="punch">パンチ</button><button data-k="kick">キック</button><button class="special" data-k="beam">スペシウム<br>光線</button><button id="restart">やり直し ↻</button></div><p class="help">PC：← → 移動 / ↑ ジャンプ / ↓ ガード / Z パンチ / X キック / C 光線<br>スマホ：移動・ガードは長押し。攻撃ボタンはタップ。</p><p class="hint">※グラフィックは独自描画による実写風への途中段階です。公式映像・スーツ写真は使用していません。</p></main><script>
'use strict';const cv=document.getElementById('game'),g=cv.getContext('2d');const W=900,F=407;const held=new Set();let p,e,secs,over,msg,fx,shots,shake,clock=0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){p={x:185,y:F,vy:0,hp:100,en:100,face:1,cool:0,anim:'idle',at:0,guard:false,walk:0,hit:0};e={x:700,y:F,hp:100,cool:80,wind:0,stun:0,attack:'tail',walk:0,hit:0};secs=180;over=false;msg='ベムラーを倒せ！';fx=[];shots=[];shake=0;held.clear()}reset();
function burst(x,y,col,n=14){for(let i=0;i<n;i++)fx.push({x,y,vx:rnd(-6,6),vy:rnd(-7,2),life:rnd(14,33),color:col,r:rnd(2,6)})}
function act(k){if(over)return;if(k==='jump'){if(p.y>=F){p.vy=-15;p.anim='jump';p.at=0}return}if(p.cool>0)return;let d=Math.abs(p.x-e.x);if(k==='punch'||k==='kick'){p.anim=k;p.at=0;p.cool=k==='punch'?23:37;let range=k==='punch'?112:144;if(d<range&&Math.abs(p.y-e.y)<100){e.hp=clamp(e.hp-(k==='punch'?9:15),0,100);e.stun=17;e.hit=13;e.x=clamp(e.x+p.face*22,80,830);burst(e.x,e.y-110,'#ffdc84');msg=k==='punch'?'パンチ命中！':'キック命中！';shake=5}else msg='攻撃が届かない！'}if(k==='beam'){if(p.en<40){msg='エネルギー不足！';return}p.en-=40;p.cool=85;p.anim='beam';p.at=0;shots.push({kind:'beam',life:24,dir:p.face,x:p.x,y:p.y-124});if((e.x-p.x)*p.face>0){e.hp=clamp(e.hp-38,0,100);e.stun=50;e.hit=26;burst(e.x,e.y-118,'#b7f7ff',34);msg='スペシウム光線 命中！';shake=12}else msg='光線が外れた！'}}
function update(){clock++;if(over)return;secs=Math.max(0,secs-1/60);p.cool=Math.max(0,p.cool-1);p.at++;e.cool=Math.max(0,e.cool-1);e.stun=Math.max(0,e.stun-1);e.hit=Math.max(0,e.hit-1);p.hit=Math.max(0,p.hit-1);shake*=.83;const dir=(held.has('right')?1:0)-(held.has('left')?1:0);p.guard=held.has('guard')&&p.y===F&&p.cool===0;if(dir){p.x=clamp(p.x+dir*(p.guard?1.5:3.7),45,855);p.face=dir;p.walk+=.19;if(p.cool===0&&p.y===F)p.anim='walk'}else if(p.cool===0&&p.y===F)p.anim=p.guard?'guard':'idle';p.y+=p.vy;p.vy+=.78;if(p.y>F){p.y=F;p.vy=0;if(p.anim==='jump')p.anim='idle'}if(p.cool===0&&p.anim!=='jump'&&!dir)p.anim=p.guard?'guard':'idle';if(e.stun===0){let dist=p.x-e.x;if(Math.abs(dist)>135){e.x=clamp(e.x+Math.sign(dist)*1.35,70,835);e.walk+=.10}if(e.wind>0){e.wind--;if(e.wind===1){if(e.attack==='tail'){if(Math.abs(p.x-e.x)<165&&Math.abs(p.y-e.y)<90){damage(16);burst(p.x,p.y-90,'#e5c49b');shake=8}}else{shots.push({kind:'fire',x:e.x,y:e.y-132,dir:Math.sign(p.x-e.x)||-1,life:70,hit:false})}}}else if(e.cool===0){e.attack=Math.abs(dist)<185?'tail':'fire';e.wind=e.attack==='tail'?30:47;e.cool=e.attack==='tail'?110:155}}for(let s of shots){s.life--;if(s.kind==='fire'){s.x+=s.dir*7.8;if(!s.hit&&Math.abs(s.x-p.x)<33&&Math.abs(s.y-(p.y-125))<65){s.hit=true;s.life=0;damage(18);burst(p.x,p.y-110,'#7ceaff',16);shake=8}}}shots=shots.filter(s=>s.life>0);for(let f of fx){f.x+=f.vx;f.y+=f.vy;f.vy+=.22;f.life--}fx=fx.filter(f=>f.life>0);p.en=clamp(p.en+.035,0,100);if(e.hp<=0){over=true;msg='勝利！ ベムラー撃破！';burst(e.x,e.y-100,'#ffc778',90);shake=18}if(p.hp<=0||secs<=0){over=true;msg=secs<=0?'時間切れ…':'敗北… ウルトラマンが倒れた'}}
function damage(n){let guarded=p.guard;p.hp=clamp(p.hp-(guarded?Math.ceil(n*.2):n),0,100);p.hit=guarded?4:16;msg=guarded?'ガード成功！':'ベムラーの攻撃！'}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function path(points,color){g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fill()}function line(x1,y1,x2,y2,w,color){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function limb(x,y,ang,len,w,base,shine){g.save();g.translate(x,y);g.rotate(ang);line(0,0,0,len,w,base);line(-w*.18,1,-w*.18,len-3,w*.27,shine);g.restore()}
function hero(){g.save();g.translate(p.x,p.y);g.scale(p.face,1);let move=p.anim==='walk'?Math.sin(p.walk):0,bob=p.anim==='walk'?Math.abs(move)*2:Math.sin(clock*.065)*1.3,attack=p.anim==='punch'&&p.at<23,kick=p.anim==='kick'&&p.at<35,beam=p.anim==='beam'&&p.at<40,guard=p.guard;g.translate(0,-bob);if(p.hit&&clock%4<2)g.globalAlpha=.55;ellipse(0,3,35,8,'#0007');const silver=g.createLinearGradient(-25,0,27,0);silver.addColorStop(0,'#677987');silver.addColorStop(.24,'#c6d1d4');silver.addColorStop(.5,'#f4f3e9');silver.addColorStop(.75,'#b2bdc5');silver.addColorStop(1,'#536b7d');const red=g.createLinearGradient(-30,0,30,0);red.addColorStop(0,'#741927');red.addColorStop(.45,'#e52d3e');red.addColorStop(.75,'#bb1b30');red.addColorStop(1,'#6f1728');let la=move*.38,ra=-move*.38;if(kick)la=-1.08;if(p.y<F){la=-.3;ra=.3}limb(-13,-55,la,51,19,silver,'#fff9');limb(13,-55,ra,51,19,silver,'#fff9');limb(-13,-52,la,31,13,red,'#ff7a81');limb(13,-52,ra,31,13,red,'#ff7a81');path([[-25,-109],[-17,-133],[16,-133],[26,-108],[20,-56],[-20,-56]],silver);path([[-22,-109],[-17,-129],[-5,-121],[-7,-61],[-18,-57]],red);path([[22,-109],[17,-129],[5,-121],[7,-61],[18,-57]],red);path([[-17,-83],[0,-73],[17,-83],[14,-58],[-14,-58]],red);ellipse(0,-115,12,9,'#aab9c0');ellipse(0,-115,8,7,secs<60&&clock%24<12?'#fa465b':'#55e8ff');ellipse(-2,-117,3,2,'#fff9');let arm1=move*-.45,arm2=move*.45;if(attack)arm2=-1.45;if(guard){arm1=-.85;arm2=-.8}if(beam){arm1=-1.35;arm2=-1.05}limb(-22,-123,arm1,43,16,red,'#fa6770');limb(22,-123,arm2,43,16,silver,'#fff9');if(attack){limb(22,-123,-1.45,50,15,silver,'#fff9')}if(beam){line(4,-116,38,-116,14,silver);line(25,-138,25,-102,13,red)}ellipse(0,-155,24,32,silver);path([[-21,-168],[-16,-181],[-7,-190],[0,-199],[8,-187],[18,-179],[23,-165],[12,-176],[-12,-176]],'#b9cbd1');path([[-4,-190],[0,-201],[4,-190],[3,-156],[-3,-156]],'#e8e9e2');path([[1,-166],[21,-172],[17,-160],[3,-156]],'#e3e6b9');path([[-2,-166],[-20,-172],[-17,-160],[-3,-156]],'#e3e6b9');line(-12,-140,12,-140,2,'#697c85');g.restore()}
function monster(){g.save();g.translate(e.x,e.y);g.scale(p.x<e.x?-1:1,1);let sway=Math.sin(clock*.045)*3,walk=Math.sin(e.walk)*5;g.translate(0,sway);if(e.hit&&clock%4<2)g.globalAlpha=.6;ellipse(0,4,56,11,'#0008');path([[-13,-65],[-75,-91],[-104,-132],[-112,-128],[-95,-76],[-45,-38]],'#526a4b');path([[-34,-61],[-41,-7],[-8,-5],[0,-69]],'#465d42');path([[13,-66],[8,-6],[42,-6],[43,-66]],'#40553b');ellipse(0,-97,51,80,'#526b4d');ellipse(-6,-100,37,69,'#728363');for(let i=0;i<6;i++){let yy=-158+i*23;path([[-32,yy],[-53,yy-13],[-45,yy+18],[-28,yy+16]],'#657b57');path([[27,yy],[49,yy-15],[44,yy+16],[28,yy+17]],'#4b6146')}for(let i=0;i<11;i++){let xx=-27+(i%4)*18,yy=-143+Math.floor(i/4)*29;ellipse(xx,yy,6,10,i%2?'#879474':'#627653')}ellipse(0,-173,37,44,'#607c54');ellipse(-8,-182,27,31,'#829875');path([[-29,-199],[-18,-222],[-7,-207],[2,-229],[11,-209],[24,-214],[30,-191]],'#657d56');ellipse(-15,-180,6,5,'#eeb85b');ellipse(15,-180,6,5,'#eeb85b');ellipse(-14,-180,2,2,'#422d19');ellipse(16,-180,2,2,'#422d19');path([[-18,-157],[17,-157],[10,-148],[-12,-148]],e.wind>0&&e.attack==='fire'?'#69e7ff':'#233d32');if(e.wind>0&&e.attack==='fire'){ellipse(28,-152,10+Math.sin(clock)*3,8,'#6ae9ff')}if(e.wind>0&&e.attack==='tail')line(-40,-100,-103,-100+Math.sin(clock*.6)*22,18,'#667d53');g.restore()}
function backdrop(){let sky=g.createLinearGradient(0,0,0,F);sky.addColorStop(0,'#091426');sky.addColorStop(.55,'#24425c');sky.addColorStop(1,'#566b73');g.fillStyle=sky;g.fillRect(0,0,900,480);ellipse(745,105,35,35,'#c5d8d94a');for(let i=0;i<36;i++){let x=(i*167)%900,y=80+(i*83)%165;ellipse(x,y,1,1,'#d8e9e577')}g.fillStyle='#1d3543';for(let i=0;i<16;i++){let x=i*64;g.fillRect(x,285+(i*37)%55,53,130)}g.fillStyle='#283e46';for(let i=0;i<20;i++){let x=i*49;g.fillRect(x,328+(i*17)%35,35,90)}g.fillStyle='#2a5b69';g.fillRect(0,F,900,73);g.fillStyle='#87a7a0';g.fillRect(0,F,900,5);g.fillStyle='#376c7a';for(let i=0;i<19;i++)g.fillRect(i*54+clock%15,F+18+(i%3)*12,28,2)}
function bar(x,y,w,value,col){g.fillStyle='#101b2b';g.fillRect(x,y,w,16);g.fillStyle=col;g.fillRect(x,y,w*clamp(value,0,100)/100,16);g.strokeStyle='#c5d2db';g.lineWidth=1;g.strokeRect(x,y,w,16)}
function draw(){g.save();if(shake>1)g.translate(rnd(-shake,shake),rnd(-shake*.5,shake*.5));backdrop();hero();monster();for(let s of shots){if(s.kind==='beam'){g.save();g.globalAlpha=Math.min(1,s.life/9);let x=s.x+s.dir*38;line(x,s.y,x+s.dir*820,s.y,22,'#44c8ff');line(x,s.y,x+s.dir*820,s.y,10,'#fff');g.restore()}else{ellipse(s.x,s.y,18,12,'#67cde9');ellipse(s.x,s.y,10,6,'#d6ffff')}}for(let f of fx){g.globalAlpha=clamp(f.life/25,0,1);ellipse(f.x,f.y,f.r,f.r,f.color)}g.globalAlpha=1;g.restore();g.fillStyle='#f3f7ff';g.font='bold 20px system-ui';g.textAlign='left';g.fillText('ウルトラマン',20,32);g.textAlign='right';g.fillText('ベムラー',880,32);bar(20,43,235,p.hp,'#49d6e9');bar(645,43,235,e.hp,'#ee665f');bar(20,67,180,p.en,'#e9c66b');g.font='bold 25px system-ui';g.textAlign='center';g.fillStyle=secs<60?'#ff6873':'#f2d376';g.fillText(Math.ceil(secs)+'秒',450,48);g.font='bold 18px system-ui';g.fillStyle='#f9e8a7';g.fillText(msg,450,100);if(secs<60&&!over){g.font='bold 14px system-ui';g.fillStyle='#ff7782';g.fillText('カラータイマー点滅',450,124)}if(over){g.fillStyle='#07101edc';g.fillRect(155,155,590,130);g.strokeStyle='#7a9cb3';g.strokeRect(155,155,590,130);g.fillStyle='#fff';g.font='bold 31px system-ui';g.fillText(msg,450,211);g.font='16px system-ui';g.fillText('「やり直し」で再挑戦！',450,246)}}
let prev=performance.now(),acc=0;function loop(now){acc+=Math.min(60,now-prev);prev=now;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);for(const b of document.querySelectorAll('[data-k]')){let k=b.dataset.k;b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.setPointerCapture(ev.pointerId);b.classList.add('pressed');if(['left','right','guard'].includes(k))held.add(k);else act(k)});for(let type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>{held.delete(k);b.classList.remove('pressed')})}document.getElementById('restart').addEventListener('click',reset);const mapping={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'guard',z:'punch',x:'kick',c:'beam'};document.addEventListener('keydown',ev=>{let k=mapping[ev.key];if(!k)return;ev.preventDefault();if(!held.has(k)&&!['left','right','guard'].includes(k))act(k);held.add(k)});document.addEventListener('keyup',ev=>{let k=mapping[ev.key];if(k)held.delete(k)});
</script></body></html>
