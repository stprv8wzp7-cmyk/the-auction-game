<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>初代ウルトラマン 2D怪獣バトル 試作</title><style>body{margin:0;background:#101827;color:white;font-family:system-ui;text-align:center}h2{margin:12px}canvas{width:min(100vw,900px);background:#15253a;touch-action:none}button{font-size:17px;padding:14px 12px;border:1px solid #718096;border-radius:10px;background:#28384e;color:white;touch-action:none}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:900px;margin:8px auto}.note{font-size:12px;color:#cbd5e1;margin:10px}</style><h2>ウルトラマン VS ベムラー</h2><canvas id="c" width="900" height="470"></canvas><div class="controls"><button data-k="left">◀ 移動</button><button data-k="right">移動 ▶</button><button data-k="jump">ジャンプ</button><button data-k="guard">ガード</button><button data-k="punch">パンチ</button><button data-k="kick">キック</button><button data-k="beam">スペシウム光線</button><button id="restart">やり直し</button></div><p class="note">PC：←→ 移動 / ↑ ジャンプ / Z パンチ / X キック / C 光線 / ↓ ガード。スマホはボタンを押して操作！</p><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');const keys=new Set();let p,e,t,ended,particles,beamFx,notice;const floor=390;
function reset(){p={x:170,y:floor,v:0,hp:100,energy:100,face:1,cool:0,guard:false};e={x:700,y:floor,hp:100,cool:0,wind:0,stun:0};t=180;ended=false;particles=[];beamFx=0;notice='ベムラーを倒せ！';}reset();
function action(k){if(ended)return;if(k==='jump'&&p.y>=floor)p.v=-15;if(p.cool>0)return;let d=Math.abs(p.x-e.x);if(k==='punch'||k==='kick'){p.cool=k==='punch'?22:35;if(d<(k==='punch'?110:140)&&Math.abs(p.y-e.y)<90){e.hp=Math.max(0,e.hp-(k==='punch'?8:14));e.stun=12;e.x+=p.face*18;notice=k==='punch'?'パンチ命中！':'キック命中！';}else notice='攻撃が届かない！';}if(k==='beam'){if(p.energy<35){notice='エネルギー不足！';return}p.energy-=35;p.cool=65;beamFx=19;if((e.x-p.x)*p.face>0){e.hp=Math.max(0,e.hp-34);e.stun=38;notice='スペシウム光線 命中！';}else notice='光線が外れた！';}}
let last=performance.now(),acc=0;function update(){if(ended)return;t-=1/60;if(t<=0){t=0;ended=true;notice='時間切れ…';}p.cool=Math.max(0,p.cool-1);e.cool=Math.max(0,e.cool-1);e.stun=Math.max(0,e.stun-1);beamFx=Math.max(0,beamFx-1);p.guard=keys.has('guard');let dir=(keys.has('right')?1:0)-(keys.has('left')?1:0);p.x=Math.max(35,Math.min(865,p.x+dir*(p.guard?1.4:4)));if(dir)p.face=dir;p.y+=p.v;p.v+=.8;if(p.y>floor){p.y=floor;p.v=0;}if(!e.stun){let dist=p.x-e.x;if(Math.abs(dist)>125)e.x+=Math.sign(dist)*1.4;if(e.cool===0){if(Math.abs(dist)<145){e.wind=25;e.cool=90;}else if(Math.random()<.012){e.wind=45;e.cool=130;}}if(e.wind>0){e.wind--;if(e.wind===1){if(Math.abs(p.x-e.x)<155&&Math.abs(p.y-e.y)<90){p.hp=Math.max(0,p.hp-(p.guard?3:14));notice=p.guard?'ガード成功！':'ベムラーの攻撃！';}}}}p.energy=Math.min(100,p.energy+.035);if(e.hp<=0){ended=true;notice='勝利！ ベムラー撃破！';}if(p.hp<=0){ended=true;notice='敗北… ウルトラマンが倒れた';}}
function bar(x,y,w,v,color){ctx.fillStyle='#263449';ctx.fillRect(x,y,w,18);ctx.fillStyle=color;ctx.fillRect(x,y,w*Math.max(0,v)/100,18);ctx.strokeStyle='#fff';ctx.strokeRect(x,y,w,18)}
function draw(){ctx.clearRect(0,0,900,470);let sky=ctx.createLinearGradient(0,0,0,390);sky.addColorStop(0,'#122038');sky.addColorStop(1,'#37546c');ctx.fillStyle=sky;ctx.fillRect(0,0,900,390);ctx.fillStyle='#233a48';for(let i=0;i<12;i++){let x=i*90;ctx.fillRect(x,255+(i%3)*18,75,140)}ctx.fillStyle='#1b4c5c';ctx.fillRect(0,390,900,80);ctx.fillStyle='#65949b';ctx.fillRect(0,390,900,6);
ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.face,1);ctx.fillStyle='#c4cbd0';ctx.fillRect(-21,-108,42,75);ctx.fillStyle='#cf2838';ctx.fillRect(-20,-88,12,55);ctx.fillRect(8,-88,12,55);ctx.fillStyle='#c4cbd0';ctx.fillRect(-16,-33,12,33);ctx.fillRect(4,-33,12,33);ctx.fillStyle='#c4cbd0';ctx.fillRect(-18,-146,36,40);ctx.fillStyle='#f3eab2';ctx.fillRect(2,-133,15,7);ctx.fillStyle=t<60&&Math.floor(t*5)%2?'#e52b37':'#54d7ee';ctx.beginPath();ctx.arc(0,-88,7,0,7);ctx.fill();ctx.fillStyle='#c4cbd0';ctx.fillRect(18,-101,29,12);ctx.restore();
ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#5d7b62';ctx.beginPath();ctx.ellipse(0,-77,48,83,0,0,7);ctx.fill();ctx.fillStyle='#789b72';ctx.beginPath();ctx.ellipse(-5,-146,33,37,0,0,7);ctx.fill();ctx.fillStyle='#f0b85e';ctx.fillRect(-24,-151,10,8);ctx.fillRect(12,-151,10,8);ctx.fillStyle='#3b5543';ctx.fillRect(-32,-33,22,33);ctx.fillRect(10,-33,22,33);ctx.fillStyle=e.wind>0?'#7ce3ff':'#294439';ctx.fillRect(-14,-123,28,9);ctx.restore();
if(beamFx>0){ctx.strokeStyle='#b6f6ff';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(p.x+p.face*38,p.y-95);ctx.lineTo(p.x+p.face*750,p.y-95);ctx.stroke();ctx.strokeStyle='white';ctx.lineWidth=5;ctx.stroke()}
ctx.fillStyle='white';ctx.font='bold 20px system-ui';ctx.fillText('ウルトラマン',22,30);ctx.fillText('ベムラー',725,30);bar(22,40,240,p.hp,'#43d5ed');bar(638,40,240,e.hp,'#f26c66');bar(22,70,180,p.energy,'#e6c85b');ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillText(Math.ceil(t)+'秒',450,48);ctx.font='bold 23px system-ui';ctx.fillText(notice,450,120);if(ended){ctx.fillStyle='#0009';ctx.fillRect(210,165,480,105);ctx.fillStyle='#fff';ctx.font='bold 30px system-ui';ctx.fillText(notice,450,224)}ctx.textAlign='left';}
function frame(now){acc+=Math.min(50,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
for(const b of document.querySelectorAll('[data-k]')){let k=b.dataset.k;b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.setPointerCapture(ev.pointerId);if(['left','right','guard'].includes(k))keys.add(k);else action(k)});b.addEventListener('pointerup',()=>keys.delete(k));b.addEventListener('pointercancel',()=>keys.delete(k))}document.getElementById('restart').onclick=reset;const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'guard',z:'punch',x:'kick',c:'beam'};document.addEventListener('keydown',ev=>{let k=map[ev.key];if(!k)return;ev.preventDefault();if(!keys.has(k)&&!['left','right','guard'].includes(k))action(k);keys.add(k)});document.addEventListener('keyup',ev=>{let k=map[ev.key];if(k)keys.delete(k)});
</script></html>
