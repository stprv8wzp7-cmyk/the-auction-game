<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE AUCTION GAME — ROUND 1</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#f7ecd9;background:#0d0c15}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:1px solid #a68c61;border-radius:12px;background:#33293b;color:#fff0d6;padding:12px}button:disabled{opacity:.32;cursor:not-allowed}button:hover:not(:disabled){background:#56415b}.app{max-width:520px;margin:auto;height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:14px;gap:10px;background:radial-gradient(circle at 50% 15%,#30233f,#13111c 65%)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #66516b;padding:4px 2px 10px}.brand{font-size:13px;letter-spacing:.17em;color:#e7c98d}.round{font-size:12px;color:#b4a5b8}.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}.art{flex:1;min-height:140px;position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid #705d7b;border-radius:17px;background:radial-gradient(ellipse at 50% 35%,#4c4057,#1c1928 65%)}.art svg{width:min(76%,310px);height:100%;max-height:360px;filter:drop-shadow(0 10px 18px #0008)}.art:after{content:'';position:absolute;bottom:0;width:100%;height:30%;background:linear-gradient(transparent,#100d1b9c);pointer-events:none}.art .plate{position:absolute;top:12px;left:12px;font-size:11px;letter-spacing:.13em;color:#ead6aa;border:1px solid #a18a64;padding:5px 9px;border-radius:5px}.item{text-align:center}.item h1{font-size:21px;margin:2px 0 5px;font-weight:600;letter-spacing:.09em}.item small{color:#cfbb9d}.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.person{background:#221e2d;border:1px solid #55485f;border-radius:10px;text-align:center;padding:7px 2px}.person strong{font-size:14px}.person span{display:block;font-size:11px;color:#c7b7c7}.person.lead{border-color:#e8c17c;background:#3c3041}.person.out{opacity:.45}.dialog{border:1px solid #806c88;border-radius:14px;background:#201b2c;padding:13px;min-height:108px}.speaker{font-size:12px;color:#f3cf8e;margin-bottom:6px}.line{font-size:14px;line-height:1.75;white-space:pre-wrap}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.actions button{min-height:47px}.actions .wide{grid-column:1/-1}.status{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#dbc9df}.log{max-height:95px;overflow:auto;font-size:12px;color:#d0c2d6;background:#14111b;border-radius:8px;padding:8px;line-height:1.6}.log div{border-bottom:1px solid #ffffff12;padding:2px 0}.note{background:#eee0b9;color:#493c2d;border-radius:10px;padding:12px;font-size:14px;line-height:1.7}.note b{color:#5c3b27}.hint{font-size:12px;color:#b8a6c0;text-align:center}.hidden{display:none!important}
</style></head><body><main class="app"><header><div class="brand">THE AUCTION GAME</div><div class="round">ROUND 01 / 05 · 試作版</div></header><div class="stage"><div class="art"><div class="plate">LOT 001 · ANTIQUE</div><svg viewBox="0 0 300 370" role="img" aria-label="銀月の懐中時計の装飾イラスト"><defs><radialGradient id="g"><stop stop-color="#f4e8bf"/><stop offset=".7" stop-color="#bca879"/><stop offset="1" stop-color="#5c4b43"/></radialGradient><linearGradient id="chain"><stop stop-color="#d7c79c"/><stop offset="1" stop-color="#675b6a"/></linearGradient></defs><path d="M150 90 C125 30 235 12 229 83 C226 110 194 120 181 82" fill="none" stroke="url(#chain)" stroke-width="7" stroke-dasharray="3 6"/><rect x="134" y="71" width="32" height="25" rx="5" fill="#a58a65" stroke="#f7e2b1" stroke-width="3"/><circle cx="150" cy="220" r="117" fill="#423844" stroke="#d3b780" stroke-width="7"/><circle cx="150" cy="220" r="106" fill="url(#g)" stroke="#fff0c9" stroke-width="3"/><circle cx="150" cy="220" r="92" fill="#242231" stroke="#bda46c" stroke-width="3"/><circle cx="150" cy="220" r="80" fill="#ece2c8" stroke="#9a845d" stroke-width="2"/><g fill="#5c4b48" font-family="Georgia" font-size="20" text-anchor="middle"><text x="150" y="159">XII</text><text x="212" y="228">III</text><text x="150" y="295">VI</text><text x="88" y="228">IX</text></g><path d="M150 220 L145 171 M150 220 L195 238" stroke="#4b3b3d" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="220" r="8" fill="#80613f"/><path d="M105 257 Q150 276 194 257" fill="none" stroke="#b8a57b" stroke-width="2"/></svg></div><div class="item"><h1>銀月の懐中時計</h1><small>想定価格 50〜150万円　·　開始 55万円</small></div><div class="cast" id="cast"></div><div class="dialog"><div class="speaker" id="speaker">—</div><div class="line" id="line"></div></div><div class="status"><span id="bidstatus">最高入札：なし</span><span id="money">所持金：200万円</span></div><div class="actions" id="actions"></div><div class="log hidden" id="log"></div><div class="hint" id="hint">1ラウンドを通して遊べる、動作確認用プロトタイプ</div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const S={phase:'intro',step:0,cash:200,balances:{A:200,B:200,C:200,D:200},bid:0,leader:null,active:new Set(['P','A','B','C','D']),observed:false,questioned:false,eavesdropped:false,bluffed:0,secret:false,turn:0,history:[],actual:128,opening:55};const scenes=[['','会場に、一つ目の品が運び込まれる。銀色の懐中時計だ。'],['B','……へえ。古い時計って、こんなに綺麗なものもあるんだな。'],['A','保存状態は悪くなさそうですね。ただ、見た目だけでは判断できません。'],['C','見た目が良くても、中身まで良いとは限らないでしょ。'],['','君の手元に、封筒が置かれる。中には君だけが読める秘密情報が入っていた。']];const npc={A:{limit:101,inc:[5,1,5]},B:{limit:89,inc:[5,5,1]},C:{limit:105,inc:[1,5,1]},D:{limit:96,inc:[1,1,5]}};const name=x=>x==='P'?'君':x;function say(w,t){$('speaker').textContent=w||'—';$('line').textContent=t}function btn(label,fn,disabled=false,wide=false){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;if(wide)b.className='wide';b.onclick=fn;$('actions').append(b)}function log(t){S.history.unshift(t);$('log').innerHTML=S.history.slice(0,8).map(x=>'<div>'+x+'</div>').join('')}function render(){ $('cast').innerHTML=['P','A','B','C','D'].map(x=>`<div class="person ${S.leader===x?'lead':''} ${!S.active.has(x)?'out':''}"><strong>${name(x)}</strong><span>${x==='P'?S.cash:S.balances[x]}万円</span></div>`).join('');$('bidstatus').textContent=S.bid?`最高入札：${S.bid}万円（${name(S.leader)}）`:'最高入札：なし';$('money').textContent=`所持金：${S.cash}万円`;$('actions').replaceChildren();$('log').classList.toggle('hidden',S.phase!=='auction');if(S.phase==='intro'){const [w,t]=scenes[S.step];say(w,t);btn(S.step===scenes.length-1?'秘密情報を確認':'次へ',()=>{if(S.step<scenes.length-1)S.step++;else S.phase='secret';render()},false,true)}else if(S.phase==='secret'){say('秘密情報','【文字盤の製造刻印】
文字盤の刻印が初期製造の特徴と一致していれば、価値を高める要素になる。実際の状態は観察しないと分からない。');btn('オークションへ',()=>{S.phase='auction';say('','競りが始まる。まずは君に行動の機会が与えられた。');renderActions()},false,true)}else if(S.phase==='auction'){renderActions()}else if(S.phase==='result'){say('鑑定結果',`落札者：${name(S.leader)}　落札額：${S.bid}万円
本物／実際の価値：${S.actual}万円
${S.leader==='P'?`君の損益：${S.actual-S.bid>=0?'+':''}${S.actual-S.bid}万円`:'君は今回は落札しなかった。'}
君の残金：${S.cash}万円`);btn('最初から遊ぶ',()=>location.reload(),false,true);btn('入札履歴を見る',()=>{$('log').classList.toggle('hidden')})}}function renderActions(){if(S.phase!=='auction')return;$('actions').replaceChildren();if(S.leader==='P'){say('','君が最高入札者だ。ライバルの判断を待つ。');btn('競りを進める',()=>advance(),false,true);return}for(const n of [1,5,10,20]){const price=S.bid?S.bid+n:S.opening;btn(S.bid?`＋${n}万円 → ${price}万円`:`開始 ${price}万円`,()=>playerBid(price),price>S.cash||price>150||(!S.bid&&n!==1))}btn('観察',()=>info('observe'),S.observed);btn('公開質問',()=>info('question'),S.questioned);btn('盗聴：A',()=>info('listen'),S.eavesdropped);btn('低評価ブラフ',()=>info('bluff'),S.bluffed>=3);btn('撤退',()=>withdraw(),false,true)}function info(type){let t='';if(type==='observe'){S.observed=true;t='文字盤の刻印は初期製造の特徴と一致している。価値を高める要素だ。これは君だけが知っている。'}if(type==='question'){S.questioned=true;t='公開質問への回答：主要部品に交換の痕跡は確認されていない。会場全員に聞こえた。'}if(type==='listen'){S.eavesdropped=true;t='イヤホンに小さな雑音が混じる。Aの声が聞こえた。「裏蓋の内側……仕上げの粗さも気になりますね」';}if(type==='bluff'){S.bluffed++;t='君「この時計に、そんな価値があるとは思えないな」
B「……そうか？ オレにはまだ分かんねーけど。」'}log(t.replace(/\n/g,' / '));if(!S.bid){npcOpen()}else npcMoves(1);say(type==='question'?'公開質問':type==='bluff'?'君':type==='listen'?'盗聴機器':'観察',t);render();say(type==='question'?'公開質問':type==='bluff'?'君':type==='listen'?'盗聴機器':'観察',t)}function npcOpen(){const who='B';S.bid=55;S.leader=who;log('Bが55万円で入札した。')}function playerBid(v){if(S.leader==='P'||v>S.cash||v>150||v<=S.bid)return;S.bid=v;S.leader='P';log(`君が${v}万円で入札。`);say('君',`${v}万円。`);npcMoves(2);render();if(S.phase==='auction')say('競り',S.leader==='P'?`現在は君が最高入札者（${S.bid}万円）。`:`${name(S.leader)}が${S.bid}万円で上回った。`)}function npcMoves(max){let count=0;for(let i=0;i<4&&count<max;i++){const who=['A','B','C','D'][(S.turn+i)%4];if(!S.active.has(who)||who===S.leader)continue;const obj=npc[who];const inc=obj.inc[(S.turn+i)%obj.inc.length];const p=S.bid?S.bid+inc:S.opening;if(p<=obj.limit&&p<=S.balances[who]&&p<=150){S.bid=p;S.leader=who;log(`${who}が${p}万円で入札。`);count++}}S.turn+=Math.max(1,max);if(S.leader==='P'){let any=false;for(const who of ['A','B','C','D'])if(S.active.has(who)&&npc[who].limit>S.bid)any=true;if(!any)finish()}}function advance(){if(S.leader!=='P')return;for(const who of ['A','B','C','D']){if(!S.active.has(who))continue;if(npc[who].limit<=S.bid){S.active.delete(who);log(`${who}が撤退。`)}}if(S.active.size===1){finish();return}npcMoves(2);render();if(S.phase==='auction')say('競り',S.leader==='P'?'ライバルたちは、まだ判断を続けている。':`${name(S.leader)}が${S.bid}万円で入札した。`)}function withdraw(){S.active.delete('P');log('君は撤退した。');let rounds=0;while(rounds++<80){let next=null;for(const who of ['A','B','C','D']){if(!S.active.has(who)||who===S.leader)continue;const p=S.bid+1;if(p<=npc[who].limit&&p<=S.balances[who]){next=who;break}}if(!next)break;S.bid++;S.leader=next;log(`${next}が${S.bid}万円で入札。`)}if(!S.bid){S.bid=55;S.leader='B'}finish()}function finish(){S.phase='result';if(S.leader==='P')S.cash=S.cash-S.bid+S.actual;else S.balances[S.leader]=S.balances[S.leader]-S.bid+S.actual;render()};render()})();
</script></body></html>
