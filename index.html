<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>キュアブラック BATTLE</title><style>*{box-sizing:border-box}body{margin:0;background:#171326;color:white;font-family:system-ui,sans-serif;touch-action:none}#wrap{max-width:900px;margin:auto;padding:10px}h2{font-size:19px;margin:5px 0 9px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#251d3b;border:2px solid #f0b5ec;border-radius:12px}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.cluster{display:flex;gap:8px;align-items:center}button{border:1px solid #eab8ff;border-radius:14px;background:#4a345f;color:white;font-weight:800;font-size:17px;min-width:57px;min-height:60px;touch-action:none;user-select:none}button:active,.down{background:#b05fc5}#reset{font-size:13px;min-height:35px;min-width:90px}p{font-size:12px;color:#c9b7d9}.hint{font-size:12px;color:#ffd9ff}</style></head><body><div id="wrap"><h2>💖 キュアブラック BATTLE <button id="reset">やり直す</button></h2><canvas id="game" width="960" height="540"></canvas><div class="controls"><div class="cluster"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="cluster"><button data-key="jump">跳ぶ</button><button data-key="attack">👊</button><button data-key="guard">防御</button><button data-key="special">✨</button></div></div><p>PC：←→ 移動 / ↑ ジャンプ / Z 攻撃 / X 防御 / C 必殺技</p><div class="hint">ゲージが100になると✨必殺技が使える！ 敵の攻撃は防御で軽減できるよ。</div></div><script>
const canvas=document.getElementById('game'),c=canvas.getContext('2d');let keys={},p,e,particles=[],state='play',last=0,elapsed=0,shake=0;const floor=445;
function reset(){p={x:170,y:floor,vy:0,hp:120,energy:0,face:1,cool:0,inv:0,guard:false,anim:0};e={x:760,y:floor,hp:180,face:-1,cool:1.2,wind:0,stun:0,anim:0};particles=[];state='play';elapsed=0}reset();document.getElementById('reset').onclick=reset;
for(const b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;const set=v=>{keys[k]=v;b.classList.toggle('down',v)};b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.setPointerCapture(ev.pointerId);set(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>set(false))}const mapping={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',z:'attack',Z:'attack',x:'guard',X:'guard',c:'special',C:'special'};window.addEventListener('keydown',ev=>{if(mapping[ev.key]){keys[mapping[ev.key]]=true;ev.preventDefault()}});window.addEventListener('keyup',ev=>{if(mapping[ev.key])keys[mapping[ev.key]]=false});
function burst(x,y,col,n=14){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=70+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.35+Math.random()*.4,col})}}
function hitEnemy(d){if(Math.abs(p.x-e.x)<115&&Math.abs(p.y-e.y)<85){e.hp=Math.max(0,e.hp-d);e.stun=.23;e.anim=.25;p.energy=Math.min(100,p.energy+22);burst(e.x,e.y-95,'#f9d0ff');shake=8;if(!e.hp)state='win'}}
let prev={};function just(k){return keys[k]&&!prev[k]}function update(dt){elapsed+=dt;if(state!=='play'){prev={...keys};return}p.cool=Math.max(0,p.cool-dt);p.inv=Math.max(0,p.inv-dt);p.anim=Math.max(0,p.anim-dt);e.anim=Math.max(0,e.anim-dt);e.stun=Math.max(0,e.stun-dt);p.guard=!!keys.guard;if(!p.guard){let dir=(keys.right?1:0)-(keys.left?1:0);p.x=Math.max(35,Math.min(925,p.x+dir*255*dt));if(dir)p.face=dir;if(just('jump')&&p.y>=floor)p.vy=-630;if(just('attack')&&p.cool===0){p.cool=.34;p.anim=.25;hitEnemy(18)}if(just('special')&&p.energy>=100){p.energy=0;p.anim=.5;if(Math.abs(p.x-e.x)<380){e.hp=Math.max(0,e.hp-65);e.stun=.6;burst(e.x,e.y-100,'#ffef8d',45);shake=18;if(!e.hp)state='win'}}}p.vy+=1550*dt;p.y=Math.min(floor,p.y+p.vy*dt);if(p.y===floor)p.vy=0;
if(e.stun<=0){let dist=p.x-e.x;if(Math.abs(dist)>100)e.x+=Math.sign(dist)*105*dt;e.face=p.x<e.x?-1:1;e.cool-=dt;if(e.cool<=0){e.wind=.42;e.cool=1.5+Math.random()*.7}if(e.wind>0){e.wind-=dt;if(e.wind<=0&&Math.abs(p.x-e.x)<135&&Math.abs(p.y-e.y)<90){let dmg=p.guard?5:17;if(!p.inv){p.hp=Math.max(0,p.hp-dmg);p.inv=.45;burst(p.x,p.y-90,'#ff7474');shake=7;if(!p.hp)state='lose'}}}}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.t-=dt;if(q.t<=0)particles.splice(i,1)}prev={...keys}}
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}function bar(x,y,w,value,max,color){rect(x,y,w,17,'#2b213b');rect(x,y,w*Math.max(0,value)/max,17,color);c.strokeStyle='#fff7';c.strokeRect(x,y,w,17)}function circle(x,y,r,color){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function drawFighter(a,hero){c.save();c.translate(a.x,a.y);c.scale(a.face,1);if(hero&&a.inv>0&&Math.floor(elapsed*18)%2===0)c.globalAlpha=.45;let atk=hero?a.anim>0:a.wind>0;c.fillStyle='#0005';c.beginPath();c.ellipse(0,0,47,10,0,0,7);c.fill();if(hero){rect(-25,-99,50,74,'#17151f');rect(-28,-28,22,29,'#18131f');rect(6,-28,22,29,'#18131f');rect(-32,-155,64,58,'#f7e7f5');rect(-33,-152,66,13,'#20202a');rect(-26,-173,52,30,'#f5c7b7');c.fillStyle='#15151d';c.beginPath();c.moveTo(-34,-166);c.lineTo(-26,-202);c.lineTo(13,-196);c.lineTo(35,-167);c.lineTo(23,-181);c.lineTo(3,-178);c.lineTo(-17,-185);c.fill();circle(13,-160,3,'#24202a');rect(-48,-135,18,58,'#f5c7b7');rect(29,-139,atk?69:18,17,'#f5c7b7');rect(27,-152,20,20,'#20202a');rect(-33,-105,65,13,'#f0b2dd');if(a.guard){c.strokeStyle='#a6eaff';c.lineWidth=8;c.beginPath();c.arc(0,-100,84,0,Math.PI*2);c.stroke()}}else{rect(-43,-125,86,100,'#49395e');rect(-35,-28,29,29,'#312b3c');rect(9,-28,29,29,'#312b3c');rect(-42,-197,84,78,'#77628c');circle(-18,-165,8,'#ff466a');circle(19,-165,8,'#ff466a');rect(-60,-115,25,65,'#6c527e');rect(35,-118,atk?78:25,26,'#6c527e');c.fillStyle='#9b82ae';c.beginPath();c.moveTo(-55,-191);c.lineTo(-82,-236);c.lineTo(-15,-208);c.lineTo(45,-236);c.lineTo(55,-192);c.fill()}c.restore()}
function draw(){c.save();if(shake>0){c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82;if(shake<.5)shake=0}let g=c.createLinearGradient(0,0,0,540);g.addColorStop(0,'#17142f');g.addColorStop(1,'#634678');c.fillStyle=g;c.fillRect(0,0,960,540);for(let i=0;i<12;i++){let x=i*94-20,h=110+(i*71)%110;rect(x,445-h,74,h,'#302945');for(let j=0;j<4;j++)rect(x+12+j*15,445-h+20,7,10,'#aa85b555')}rect(0,445,960,95,'#4b3c60');rect(0,445,960,8,'#c2a5d2');drawFighter(p,true);drawFighter(e,false);for(let q of particles)circle(q.x,q.y,5,q.col);rect(15,14,350,83,'#171126cc');rect(595,14,350,83,'#171126cc');c.fillStyle='white';c.font='bold 21px system-ui';c.fillText('キュアブラック',25,40);c.fillText('ザケンナー',605,40);bar(25,50,320,p.hp,120,'#f675b6');bar(605,50,320,e.hp,180,'#dd506d');c.font='bold 14px system-ui';c.fillText(`HP ${p.hp}/120`,25,84);c.fillText(`HP ${e.hp}/180`,605,84);c.fillText('必殺技',25,115);bar(90,102,210,p.energy,100,'#ffe58a');c.fillText(`${p.energy}%`,310,116);if(e.wind>0){c.fillStyle='#ffdb76';c.font='bold 23px system-ui';c.fillText('⚠ 攻撃予兆！',e.x-75,e.y-260)}if(state!=='play'){rect(0,0,960,540,'#110d20bb');c.textAlign='center';c.fillStyle='#fff';c.font='bold 56px system-ui';c.fillText(state==='win'?'VICTORY! ✨':'GAME OVER',480,255);c.font='25px system-ui';c.fillText('「やり直す」で再挑戦！',480,309);c.textAlign='left'}c.restore()}
function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
