 const shape=motifs[type]||motifs.watch;
 return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="bg"><stop stop-color="#3b2518"/><stop offset=".55" stop-color="#120d0c"/><stop offset="1" stop-color="#05070c"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a8"/><stop offset=".28" stop-color="#d9a43f"/><stop offset=".62" stop-color="#8a511c"/><stop offset="1" stop-color="#f1c867"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="120" height="120" fill="url(#bg)"/><circle cx="20" cy="20" r="18" fill="#d6a348" opacity=".08"/><circle cx="101" cy="95" r="25" fill="#d6a348" opacity=".06"/><g fill="#100b08" stroke="url(#gold)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" filter="url(#gl)">${shape}</g><g fill="none" stroke="#d7b369" opacity=".55"><path d="M7 24V7h17M96 7h17v17M7 96v17h17M96 113h17V96"/><path d="M10 15h20M90 105h20"/></g><g fill="#f6d98b" opacity=".7"><circle cx="13" cy="13" r="1.2"/><circle cx="107" cy="13" r="1.2"/><circle cx="13" cy="107" r="1.2"/><circle cx="107" cy="107" r="1.2"/></g></svg>`}
function setTalk(sp,role,txt,n='次へ ▶'){speaker.textContent=sp;document.getElementById('role').textContent=role;dialog.textContent=txt;next.textContent=n}
function startRound(){S.active={P:true,A:true,B:true,C:true,D:true};S.current=0;S.highest=null;S.eaves=false;S.item=makeItem();if(S.round===1){S.item.name='翡翠のブローチ';S.item.type='gem';S.item.desc='深い色味の翡翠を据えた古いブローチ。台座の細工にも注目が集まる。';}save();intro()}
function intro(){screen('adv');Q=[{k:'reactions'},{k:'secret'},{k:'say',sp:'PLAYER',role:'YOU / あなた',txt:'（……いよいよ始まる。\nまずは様子を見て、情報を集めよう。）',who:'P'},{k:'say',sp:'',role:'',txt:'短い沈黙のあと、最初の競売が始まる。',who:null},{k:'go'}];showReveal()}
function productVisual(){return S.round===1?'<img src="assets/brooch_clean_v2.png" alt="翡翠のブローチ" style="width:100%;height:100%;object-fit:cover;display:block">':art(S.item.type)}
function showReveal(){hide();charHero.style.display='none';reveal.classList.remove('hidden');reveal.innerHTML=`<div class="productArt">${productVisual()}</div><div class="revealMeta"><div class="lot">LOT ${String(S.round).padStart(2,'0')}</div><h1>${S.item.name}</h1><div class="estimate">想定価格 ${S.item.min}〜${S.item.max}万円</div><div class="desc">${S.item.desc}</div></div>`;setTalk('','',`第${S.round}ラウンドの出品物が、静かに壇上へ運ばれる。`,'みんなの反応を見る ▶')}
function showReactions(){hide();charHero.style.display='none';react.classList.remove('hidden');react.innerHTML='ABCD'.split('').map(k=>`<div class="reactRow"><div class="reactPortrait"><img src="${PIC[k]}"></div><div class="reactTxt"><b class="${k}">${k}</b><span class="muted">${ROLE[k]}</span><br>${REACT[k]}</div></div>`).join('');setTalk('','','四人の視線が、品物へ集まる。','秘密情報を受け取る ▶')}
function showSecret(){hide();charHero.style.display='none';secret.classList.remove('hidden');secret.innerHTML=`<div class="paper"><h2>◆ 秘密情報 ◆</h2><div class="hand">PLAYERへ<br><br><span class="underline">${S.item.playerSecret}</span></div><small>※この情報は他のプレイヤーには知られていない。<br>※A・B・C・Dにも、それぞれ別の秘密情報が1つだけ配られている。</small></div>`;setTalk('秘密情報','PRIVATE INFORMATION','他の四人にも別々の情報が渡された。内容は見えない。','オークション開始へ ▶')}
function showSay(x){hide();const tag=document.getElementById('playerTag');tag.classList.remove('show');if(x.who){charHero.style.display='flex';charImg.src=ADV[x.who];if(x.who==='P')tag.classList.add('show')}else{charHero.style.display='none'};setTalk(x.sp||'',x.role||(x.who?ROLE[x.who]:'')||'',x.txt,Q.length?'会話を進める ▶':'行動選択へ ▶')}
function advance(){if(!Q.length){render();screen('auction');return}let x=Q.shift();if(x.k==='reactions')showReactions();else if(x.k==='secret')showSecret();else if(x.k==='say')showSay(x);else{render();screen('auction')}}
function mood(k){if(!S.active[k])return'静観';if(S.highest===k)return k==='A'?'集中':k==='B'?'興奮':k==='C'?'微笑': '執着';let z=S.current/(S.item.max||1);return k==='A'?(z>.65?'警戒':'観察'):k==='B'?(z>.55?'焦り':'期待'):k==='C'?(z>.55?'含み笑い':'無表情'):(S.aggr>1?'苛立ち':'凝視')}
function render(){round.textContent=`ROUND ${S.round} / 5`;money.textContent=S.money.P+'万円';advMoney.textContent=S.money.P+'万円';miniArt.innerHTML=productVisual();itemName.textContent=S.item.name;est.textContent=`${S.item.min}〜${S.item.max}万円`;cur.textContent=S.current?S.current+'万円':'開始前';clue.textContent='🔒 '+S.item.playerSecret;faces.innerHTML='ABCD'.split('').map(k=>`<button class="face" data-rival="${k}" onclick="inspect('${k}')"><img src="${PIC[k]}"><span class="mood">${mood(k)}</span><span class="foot"><b>${k}</b><span>${S.money[k]}万</span></span></button>`).join('');save()}
function scene(sp,txt){Q=[{k:'say',sp,who:sp,txt},{k:'go'}];advance()}
function observe(){scene('PLAYER',`僕は品物を近くで見る。\n${Math.random()<.55?'気になる痕跡がある。':'決定的な確信までは持てない。'}`)}
function question(){Q=[{k:'say',sp:'PLAYER',who:'P',txt:'僕は司会に質問する。答えは全員に聞こえる。'},{k:'say',sp:'A',who:'A',txt:'「なるほど。あなたはそこを確認するのですね。」'},{k:'go'}];advance()}
function eavesdrop(){if(S.eaves)return openM('<h3>盗聴</h3><p>このラウンドではもう使っている。</p><button class="btn" onclick="closeM()">戻る</button>');openM('<h3>誰を盗聴する？</h3>'+['A','B','C','D'].map(k=>`<button class="btn" onclick="doEaves('${k}')">${k}　${ROLE[k]}</button>`).join(''))}
function doEaves(k){S.eaves=true;closeM();let t={A:`「……${S.npcSecrets.A} これは覚えておきましょう。」`,B:`「あー……${Math.random()<.5?S.npcSecrets.B:'腹減ったな。'}」`,C:`「ふーん……${S.npcSecrets.C} そうなんだ。」`,D:`「…………${S.npcSecrets.D} ……お前はどう出る。」`}[k];scene(k,t)}
function bluff(){openM('<h3>ブラフ</h3><button class="btn" onclick="doBluff(0)">「僕には、そこまで価値があるようには見えないけどね」</button><button class="btn" onclick="doBluff(1)">「君たち、本当にこの価値に気づいてないの？」</button>')}
function doBluff(x){closeM();S.aggr+=x;scene('PLAYER',x?'君たち、本当にこの価値に気づいてないの？':'僕には、そこまで価値があるようには見えないけどね。')}
function bidPrompt(){let m=S.current?S.current+5:five(Math.max(5,S.item.min*.55));openM(`<h3>入札</h3><p>現在価格：${S.current||'開始前'}万円</p><input id="bv" type="number" inputmode="numeric" step="5" min="${m}" value="${m}" style="width:100%;padding:12px;background:#06101d;color:#fff;border:1px solid #4b6680;border-radius:8px;font-size:18px"><button class="btn" onclick="doBid()">この金額で入札</button><button class="btn" onclick="closeM()">戻る</button>`)}
function doBid(){let v=five(Number(bv.value));if(v<=S.current||v>S.money.P)return;closeM();S.current=v;S.highest='P';S.aggr++;S.history.push(`あなたが${v}万円で入札`);npcTurn();let after=S.highest==='P'?`僕は${v}万円で入札する。`:`僕は${v}万円で入札する。\n……すぐに${S.highest}が${S.current}万円を重ねてきた。`;scene('PLAYER',after)}
function npcTurn(){for(const k of 'ABCD'){if(!S.active[k])continue;let secretBoost=S.npcSecrets[k].includes(S.item.good)?.18:0;if(Math.random()<.26+secretBoost&&S.current+5<=S.money[k]&&S.current<S.item.max*.92){let v=five(Math.min(S.money[k],S.current+rr(1,3)*5));S.current=v;S.highest=k;S.history.push(`${k}が${v}万円で入札`)}else if(S.current>S.item.max*.75&&Math.random()<.2){S.active[k]=false;S.history.push(`${k}が降りた`)}}}
function fold(){S.active.P=false;scene('PLAYER','僕は今回は降りる。')}
function inspect(k){let line={A:'「……まだ上げるつもりですか？」',B:'「オマエもまだ行くだろ？ 面白くなってきた！」',C:'「ふーん……キミ、ボクの顔ばっかり見てるね。」',D:'「…………お前、次はどうする。」'}[k];openM(`<div class="charCard"><img src="${ADV[k]}"><div class="charOverlay"><h2 class="${k}">${k} <small class="muted">${ROLE[k]}</small></h2><div class="chips"><span class="chip">${mood(k)}</span><span class="chip">所持金 ${S.money[k]}万円</span></div><p>${line}</p></div></div><button class="btn" onclick="showHistory()">入札履歴を見る</button><button class="btn" onclick="closeM()">閉じる</button>`)}
function showHistory(){modal.innerHTML='<h2>入札履歴</h2><div class="history">'+(S.history.length?S.history.map(x=>'● '+x).join('<br>'):'まだ入札はありません。')+'</div><button class="btn" onclick="closeM()">閉じる</button>'}
function openM(h){modal.innerHTML=h;shade.classList.add('show')}function closeM(){shade.classList.remove('show')}
function gameMenu(){openM('<div class="menuBg"><h2>ゲームメニュー</h2><button class="btn" onclick="closeM()">続きから</button><button class="btn" onclick="newGame()">↻ 新しく始める</button><button class="btn" onclick="showHistory()">入札履歴</button></div>')}
function newGame(){localStorage.removeItem('auctionV48');S=fresh();closeM();startRound()}
if(!S.item)startRound();else{render();screen('auction')}
</script></body></html>
